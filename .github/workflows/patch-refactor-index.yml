name: Patch refactor index cache versions

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index cache versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'QR在庫管理・開発版': 'QR在庫管理・リファクターテスト B11',
              './network-control.js?v=1': './network-control.js?v=2',
              './app.js?v=66': './app.js?v=67',
              './sales-stockin.js?v=96': './sales-stockin.js?v=97',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/patch-refactor-index.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-refactor-index.yml
          git commit -m "Refresh refactor test entrypoint cache versions"
          git push
