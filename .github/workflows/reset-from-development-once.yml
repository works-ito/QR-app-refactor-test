name: Reset refactor test from development

on:
  push:
    paths:
      - '.github/workflows/reset-from-development-once.yml'

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor test
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone development baseline
        run: git clone --depth 1 https://github.com/works-ito/QR-app-development.git /tmp/QR-app-development

      - name: Replace refactor test contents
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/QR-app-development/ ./

      - name: Commit and push clean baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to reset.'
            exit 0
          fi
          git commit -m 'Reset refactor test to QR-app-development main'
          git push origin HEAD:main
